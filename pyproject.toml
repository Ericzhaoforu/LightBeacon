[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lightbeacon"
version = "0.1.0"
description = "LAN control service, protocol tools, and simulator for ESP32 LightBeacon nodes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
lightbeacon-host = "lightbeacon.cli:host_main"
lightbeacon-sim = "lightbeacon.simulator:main"
lightbeacon-protocol = "lightbeacon.protocol_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["host/lightbeacon"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

